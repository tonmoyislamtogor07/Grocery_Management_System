<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports � Sufian Store GMS</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/reports.css">
</head>
<body data-page="reports">
<div class="app" id="app-root">
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow-date" id="todayDate"></div>
        <h1 class="page-title">Reports</h1>
        <div class="page-desc">Sales, purchases, profit and inventory reporting in one place.</div>
      </div>
    </div>

    <div class="content">

      <div class="ledger-panel">
        <div class="ledger-panel-head reports-head">
          <div class="toolbar" id="tabBar">
            <button class="btn btn-primary btn-sm" data-tab="sales">Sales</button>
            <button class="btn btn-ghost btn-sm" data-tab="purchases">Purchases</button>
            <button class="btn btn-ghost btn-sm" data-tab="profit">Profit</button>
            <button class="btn btn-ghost btn-sm" data-tab="topselling">Top-Selling</button>
            <button class="btn btn-ghost btn-sm" data-tab="inventory">Low-Stock &amp; Expiry</button>
            <button class="btn btn-ghost btn-sm" data-tab="suppliers">Supplier Summary</button>
            <button class="btn btn-ghost btn-sm" data-tab="insights">Insights</button>
          </div>
          <div class="toolbar" id="dateFilterBar">
            <select id="periodSelect">
              <option value="daily">Daily</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
              <option value="all">All time</option>
            </select>
            <select id="insightRange" style="display:none">
              <option value="last6">Last 6 months</option>
              <option value="last12" selected>Last 12 months</option>
              <option value="ytd">This year (YTD)</option>
              <option value="all">All time</option>
            </select>
            <select id="insightMonth" style="display:none" title="YTD through month"></select>
          </div>
        </div>

        <div class="ledger-panel-body" id="reportBody"></div>
      </div>

    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
