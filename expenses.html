<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — Sufian Store GMS</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/expenses.css">
</head>
<body data-page="expenses">
<div class="app" id="app-root">
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow-date" id="todayDate"></div>
        <h1 class="page-title">Expenses</h1>
        <div class="page-desc">Log rent, electricity, salary, transport and other overhead so net profit stays accurate.</div>
      </div>
      <button class="btn btn-primary" id="addBtn">+ Add expense</button>
    </div>

    <div class="content">
      <div class="stat-row" id="statRow"></div>

      <div class="ledger-panel">
        <div class="ledger-panel-head">
          <h2>Expense ledger</h2>
          <div class="toolbar">
            <select id="categoryFilter">
              <option value="">All categories</option>
              <option value="Rent">Rent</option>
              <option value="Electricity">Electricity</option>
              <option value="Salary">Salary</option>
              <option value="Transport">Transport</option>
              <option value="Other">Other</option>
            </select>
            <input type="text" id="searchInput" class="search-input" placeholder="Search description...">
          </div>
        </div>
        <div class="ledger-panel-body ledger-panel-body--flush">
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Date</th><th>Category</th><th>Description</th><th class="cell-num">Amount</th><th></th></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add expense</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="expenseForm">
        <input type="hidden" id="expenseId">
        <div class="form-grid">
          <div class="field">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory">
              <option value="Rent">Rent</option>
              <option value="Electricity">Electricity</option>
              <option value="Salary">Salary</option>
              <option value="Transport">Transport</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="expenseDate">Date</label>
            <input type="date" id="expenseDate">
          </div>
          <div class="field span-2">
            <label for="expenseDescription">Description</label>
            <input type="text" id="expenseDescription" placeholder="e.g. August electricity bill">
          </div>
          <div class="field span-2">
            <label for="expenseAmount">Amount spent</label>
            <input type="number" id="expenseAmount" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save expense</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
