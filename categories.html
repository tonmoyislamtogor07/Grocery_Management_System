<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — Sufian Store GMS</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/categories.css">
</head>
<body data-page="categories">
<div class="app" id="app-root">
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow-date" id="todayDate"></div>
        <h1 class="page-title">Categories</h1>
        <div class="page-desc">Group products so they're easy to find and report on.</div>
      </div>
      <button class="btn btn-primary" id="addBtn">+ Add category</button>
    </div>

    <div class="content">
      <div class="ledger-panel">
        <div class="ledger-panel-head">
          <h2>All categories</h2>
          <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search categories...">
          </div>
        </div>
        <div class="ledger-panel-body ledger-panel-body--flush">
          <div class="table-wrap">
            <table>
              <thead><tr><th>ID</th><th>Category name</th><th class="cell-num">Products</th><th></th></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add category</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="categoryForm">
        <input type="hidden" id="categoryId">
        <div class="field">
          <label for="categoryName">Category name</label>
          <input type="text" id="categoryName" placeholder="e.g. Rice & Grains">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save category</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
