<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Sufian Store GMS</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="dashboard">
<div class="app" id="app-root">
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow-date" id="todayDate"></div>
        <h1 class="page-title">Dashboard</h1>
        <div class="page-desc">Today's snapshot of sales, stock and profit.</div>
      </div>
      <a href="sales.html" class="btn btn-accent">+ New Sale</a>
    </div>

    <div class="content">

      <div id="lowStockNotice"></div>

      <div class="stat-row" id="statRow"></div>

      <div class="ledger-panel">
        <div class="ledger-panel-head">
          <h2>Low stock &amp; expiry watch</h2>
          <a href="products.html" class="btn btn-ghost btn-sm">Manage products</a>
        </div>
        <div class="ledger-panel-body ledger-panel-body--flush">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Product</th><th>Category</th><th class="cell-num">Stock</th><th>Status</th><th>Expiry</th></tr>
              </thead>
              <tbody id="watchBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="invoice-shell dashboard-columns">
        <div class="ledger-panel">
          <div class="ledger-panel-head"><h2>Top-selling products</h2></div>
          <div class="ledger-panel-body ledger-panel-body--flush">
            <table>
              <thead><tr><th>Product</th><th class="cell-num">Units sold</th></tr></thead>
              <tbody id="topSellingBody"></tbody>
            </table>
          </div>
        </div>

        <div class="ledger-panel">
          <div class="ledger-panel-head">
            <h2>Recent sales</h2>
            <a href="reports.html" class="btn btn-ghost btn-sm">View reports</a>
          </div>
          <div class="ledger-panel-body ledger-panel-body--flush">
            <table>
              <thead><tr><th>Receipt</th><th>Customer</th><th>Date</th><th class="cell-num">Total</th></tr></thead>
              <tbody id="recentSalesBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
