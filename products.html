    <div class="topbar">
      <div>

        <h1 class="page-title">Products</h1>
        <div class="page-desc">Your full catalog, with live stock and expiry tracking.</div>

      <button class="btn btn-primary" id="addBtn">+ Add product</button>
    </div>

    <div class="content">
      <div class="ledger-panel">

          <h2>All products</h2>

            <select id="categoryFilter">
              <option value="">All categories</option>

            <select id="statusFilter">

        <div class="ledger-panel-body ledger-panel-body--flush">

            <table>
              <thead>
                <tr>
                  <th>ID</th><th>Product name</th><th>Category</th><th>Suppliers</th>
                  <th class="cell-num">Price</th><th class="cell-num">Stock</th>
                  <th>Status</th><th>Expiry</th><th></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
